# Use together with docker-compose.yml and infra/fashiongen.env.example.
# Dataset, cached index, checkpoint and Hugging Face cache are read-only inputs.
services:
  seed:
    command: ["python", "/app/infra/scripts/import_fashiongen.py"]
    volumes:
      - ./infra:/app/infra:ro
      - ${FASHIONGEN_DATA_DIR:?Set FASHIONGEN_DATA_DIR}:/source/dataset:ro
      - ./ai-worker/vector_db:/source/index:ro
      - ./ai-worker/checkpoints:/source/checkpoints:ro
      - ${HF_B16_CACHE_DIR:?Set HF_B16_CACHE_DIR}:/source/hf-model:ro
  index-worker:
    environment:
      MAX_CATALOG_IMAGES: "50000"
